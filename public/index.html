<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jokebox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <h1>Jokebox</h1>
        <p class="tagline">A very small service with a very large opinion of itself.</p>
      </header>

      <section class="controls">
        <label class="field">
          <span class="field__label">Category</span>
          <select id="category" aria-label="Filter jokes by category">
            <option value="">All categories</option>
          </select>
        </label>
        <button id="next" class="button button--primary" type="button">
          New joke
        </button>
      </section>

      <section class="card" aria-live="polite">
        <p id="setup" class="card__setup">Loading a joke&hellip;</p>
        <p id="punchline" class="card__punchline" hidden></p>
        <div class="card__footer">
          <span id="tag" class="tag" hidden></span>
          <button id="reveal" class="button" type="button" disabled>
            Reveal punchline
          </button>
        </div>
      </section>

      <p id="error" class="error" hidden role="alert"></p>

      <footer class="footer">
        <span id="build" class="footer__build">&nbsp;</span>
        <a class="footer__link" href="/healthz">/healthz</a>
      </footer>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
